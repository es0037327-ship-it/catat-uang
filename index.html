<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Catat Uang</title>
    
    <style>
        /* CSS Dark Mode - Dibuat Full Width agar tidak ada ruang kosong */
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #121212; margin: 0; padding: 0; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; min-height: 100vh; background: #1a1a1a; display: flex; flex-direction: column; position: relative; box-sizing: border-box; }
        .content-wrapper { display: flex; flex-direction: column; flex: 1; padding-bottom: 30px; }

        /* Navigasi Atas */
        .navbar { display: flex; background: #111111; color: #fff; border-bottom: 2px solid #2d2d2d; }
        .nav-item { flex: 1; text-align: center; padding: 14px; cursor: pointer; opacity: 0.5; border-bottom: 3px solid transparent; transition: all 0.2s ease; font-weight: 600; -webkit-tap-highlight-color: transparent; user-select: none; }
        .nav-item.active { opacity: 1; color: #ff3333 !important; border-bottom: 3px solid #ff3333 !important; }

        /* Konten Halaman */
        .page { padding: 20px; display: none; }
        .page.active { display: block !important; }

        /* Dashboard */
        .dashboard-saldo { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
        .saldo-box { background: #111111; border: 1px solid #ff3333; padding: 15px; border-radius: 12px; text-align: center; }
        .saldo-main { font-size: 26px; font-weight: bold; margin-top: 5px; }
        .ewallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .saldo-sub { background: #222222; border: 1px solid #333; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; }
        .saldo-sub span { display: block; font-weight: bold; font-size: 15px; color: #ff3333; margin-top: 3px; }

        /* Form & Input */
        label { font-size: 11px; color: #bbb; font-weight: bold; display: block; margin-top: 10px; text-transform: uppercase; }
        input, select { width: 100%; padding: 15px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #262626; color: white; box-sizing: border-box; font-size: 16px; -webkit-tap-highlight-color: transparent; }
        
        /* Tombol */
        button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; background: #ff3333; color: white; }
        .btn-danger { background: transparent; color: #ff3333; border: 1px solid #ff3333; }
        
        /* Riwayat & List */
        .list-transaksi { margin-top: 15px; background: #161616; border-radius: 8px; border: 1px solid #222; }
        .item { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .item-info { display: flex; flex-direction: column; }
        .item-acc { font-size: 11px; color: #888; margin-top: 2px; }
        .pemasukan { color: #2ecc71; font-weight: bold; }
        .pengeluaran { color: #ff3333; font-weight: bold; }

        /* Modal & Efek */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; display: none; }
        .custom-alert { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; border: 2px solid #ff3333; padding: 20px; border-radius: 12px; z-index: 101; width: 85%; max-width: 300px; text-align: center; display: none; }
        .custom-alert.show { display: block !important; }
        #fwCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; display: none; }
    </style>
</head>
<body>

<canvas id="fwCanvas"></canvas>
<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="centerAlert" class="custom-alert">
    <p id="alertText">Notifikasi</p>
    <div id="modalButtonsContainer"></div>
</div>

<div class="container">
    <div class="content-wrapper">
        <div class="navbar">
            <div class="nav-item active" id="tab1" onclick="switchPage('dompet', 'tab1')">💰 Dompet</div>
            <div class="nav-item" id="tab2" onclick="switchPage('celengan', 'tab2')">🐷 Celengan</div>
        </div>

        <div id="page-dompet" class="page active">
            <div class="dashboard-saldo">
                <div class="saldo-box">
                    <div style="font-size: 12px; color: #aaa;">SALDO AKTIF</div>
                    <div class="saldo-main" id="totalSaldo">Rp 0</div>
                </div>
                <div class="ewallet-grid">
                    <div class="saldo-sub">💼 Cash<span id="saldoCash">Rp 0</span></div>
                    <div class="saldo-sub">🔵 DANA<span id="saldoDana">Rp 0</span></div>
                    <div class="saldo-sub">🟢 GOPAY<span id="saldoGopay">Rp 0</span></div>
                    <div class="saldo-sub">📊 Transaksi<span id="countTransaksi">0</span></div>
                </div>
            </div>
            <label>Nominal:</label>
            <input type="number" id="jumlah" inputmode="numeric" placeholder="0">
            <label>Keterangan:</label>
            <input type="text" id="keterangan" placeholder="Contoh: Makan siang">
            <label>Akun:</label>
            <select id="akun"><option value="cash">💼 Cash</option><option value="dana">🔵 DANA</option><option value="gopay">🟢 GOPAY</option></select>
            <label>Jenis:</label>
            <select id="jenis"><option value="pemasukan">Pemasukan (+)</option><option value="pengeluaran">Pengeluaran (-)</option></select>
            <button onclick="tambahTransaksi()">Catat Transaksi</button>
            <div class="list-transaksi" id="riwayat"></div>
            <button class="btn-danger" onclick="resetRiwayatDompet()">⚠️ Bersihkan Riwayat</button>
        </div>

        <div id="page-celengan" class="page">
            <div id="formSetTarget">
                <input type="text" id="namaTarget" placeholder="Mau beli apa?">
                <input type="number" id="nominalTarget" inputmode="numeric" placeholder="Target Harga (Rp)">
                <input type="number" id="kemampuanNabung" inputmode="numeric" placeholder="Target per hari (Rp)">
                <button onclick="simpanTarget()">Aktifkan Celengan</button>
            </div>
            <div id="displayCelengan" style="display: none;">
                <h3 id="viewNama">Target Nama</h3>
                <div style="background:#333; height:15px; border-radius:10px;"><div id="viewProgress" style="background:#ff3333; height:100%; width:0%; border-radius:10px;"></div></div>
                <p id="viewTerkumpul" style="margin-top:10px;"></p>
                <input type="number" id="nominalSetor" inputmode="numeric" placeholder="Setor (Rp)">
                <select id="sumberSetor"><option value="cash">💼 Cash</option><option value="dana">🔵 DANA</option><option value="gopay">🟢 GOPAY</option></select>
                <button onclick="setorManualCelengan()">Masukin Celengan</button>
                <button class="btn-danger" onclick="resetCelenganSaja()">❌ Reset Target</button>
            </div>
        </div>
    </div>
</div>

<script>
    let transaksi = JSON.parse(localStorage.getItem('dataKeuangan')) || [];
    let targetTabungan = JSON.parse(localStorage.getItem('dataCelengan')) || null;
    let akumulasiCelengan = parseInt(localStorage.getItem('saldoCelenganTerisi')) || 0;

    function switchPage(p, t) {
        document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
        document.getElementById('page-' + p).classList.add('active');
        document.getElementById(t).classList.add('active');
        updateDOM();
    }

    function updateDOM() {
        let cash=0, dana=0, gopay=0;
        transaksi.forEach(i => {
            let val = i.jenis === 'pemasukan' ? i.jumlah : -i.jumlah;
            if(i.akun === 'cash') cash += val; if(i.akun === 'dana') dana += val; if(i.akun === 'gopay') gopay += val;
        });
        document.getElementById('totalSaldo').innerText = 'Rp ' + (cash+dana+gopay).toLocaleString();
        document.getElementById('saldoCash').innerText = 'Rp ' + cash.toLocaleString();
        document.getElementById('saldoDana').innerText = 'Rp ' + dana.toLocaleString();
        document.getElementById('saldoGopay').innerText = 'Rp ' + gopay.toLocaleString();
        document.getElementById('countTransaksi').innerText = transaksi.length;
        
        const riwayat = document.getElementById('riwayat');
        riwayat.innerHTML = '';
        [...transaksi].reverse().forEach(i => {
            riwayat.innerHTML += `<div class="item"><div class="item-info"><span>${i.keterangan}</span><span class="item-acc">${i.akun}</span></div><span class="${i.jenis === 'pemasukan'?'pemasukan':'pengeluaran'}">${i.jenis === 'pemasukan'?'+':'-'} Rp ${i.jumlah.toLocaleString()}</span></div>`;
        });
        
        if(targetTabungan) {
            document.getElementById('formSetTarget').style.display = 'none';
            document.getElementById('displayCelengan').style.display = 'block';
            document.getElementById('viewNama').innerText = targetTabungan.nama;
            let persentase = (akumulasiCelengan / targetTabungan.nominal) * 100;
            document.getElementById('viewProgress').style.width = persentase + '%';
            document.getElementById('viewTerkumpul').innerText = 'Terkumpul: Rp ' + akumulasiCelengan.toLocaleString();
        } else {
            document.getElementById('formSetTarget').style.display = 'block';
            document.getElementById('displayCelengan').style.display = 'none';
        }
        localStorage.setItem('dataKeuangan', JSON.stringify(transaksi));
        localStorage.setItem('saldoCelenganTerisi', akumulasiCelengan);
    }

    function tambahTransaksi() {
        const j = parseInt(document.getElementById('jumlah').value);
        const k = document.getElementById('keterangan').value;
        if(j > 0 && k) {
            transaksi.push({jumlah: j, keterangan: k, akun: document.getElementById('akun').value, jenis: document.getElementById('jenis').value});
            updateDOM();
        }
    }

    function simpanTarget() {
        targetTabungan = { nama: document.getElementById('namaTarget').value, nominal: parseInt(document.getElementById('nominalTarget').value), harian: parseInt(document.getElementById('kemampuanNabung').value) };
        localStorage.setItem('dataCelengan', JSON.stringify(targetTabungan));
        updateDOM();
    }

    function setorManualCelengan() {
        const n = parseInt(document.getElementById('nominalSetor').value);
        if(n > 0) { akumulasiCelengan += n; updateDOM(); }
    }

    function resetRiwayatDompet() { transaksi = []; localStorage.removeItem('dataKeuangan'); updateDOM(); }
    function resetCelenganSaja() { targetTabungan = null; akumulasiCelengan = 0; localStorage.removeItem('dataCelengan'); localStorage.removeItem('saldoCelenganTerisi'); updateDOM(); }
    function closeModal() { document.getElementById('centerAlert').style.display = 'none'; document.getElementById('modalOverlay').style.display = 'none'; }
    updateDOM();
</script>
</body>
</html>
